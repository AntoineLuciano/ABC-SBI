# MLP configuration optimized for regression tasks
# Used with: abcnre create_estimator --classifier-config this_file.yaml

network_name: "mlp"
network_size: "default"
training_size: "default"
lr_scheduler_name: "reduce_on_plateau"
lr_scheduler_variant: "default"
stopping_rules_variant: "balanced"
experiment_name: "regressor_mlp_stable"

# Training overrides optimized for regression
overrides:
  training:
      num_epochs: 500
      batch_size: 512  # Smaller batch for stability
      learning_rate: 0.0001  # Much lower LR
      weight_decay: 0.0001  # Lower weight decay
      optimizer: "adamw"
  network:
    network_args: 
      activation: "elu"
      hidden_dims: [128, 64, 32]  # Deeper network
      dropout_rate: 0.1  # Add dropout for regularization
