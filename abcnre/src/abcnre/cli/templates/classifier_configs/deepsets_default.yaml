# Classifier configuration for neural ratio estimation with DeepSets
# Used with: abcnre create_estimator --classifier-config this_file.yaml

network_name: "deepset"
network_size: "default"
training_size: "default"
lr_scheduler_name: "reduce_on_plateau"
lr_scheduler_variant: "default"
stopping_rules_variant: "balanced"
experiment_name: "nre_deepset_training"

# Optional overrides for specific training parameters
overrides:
  training:
      num_epochs: 200
      batch_size: 1024
      learning_rate: 0.001
      weight_decay: 0.001
      optimizer: "adamw"
  network:
    network_args: 
      activation: "elu"
      pooling_type: "mean"  # Options: "mean", "sum", "max", "attention"
      phi_hidden_dims: [64, 64, 32]  # Per-element processing layers
      rho_hidden_dims: [64, 64, 32]  # Post-pooling layers
